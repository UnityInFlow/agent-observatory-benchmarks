# Every evaluator, verifier and hook in this repository is a shell script, and a shell error in
# an evaluator is a wrong verdict, not a crash. ShellCheck runs over all tracked `*.sh` — every
# `tasks/*/evaluator.sh`, every `tasks/*/verify-evaluator.sh`, and `.claude/hooks/`.
#
# Not path-scoped, unlike the other workflows: it is cheap, and a script anywhere can break.
name: shellcheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shell — ShellCheck finds no warnings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Warnings are now enforced; the one suppression is SC2053 in .claude/hooks/opencode-review.sh (a deliberate glob match against REVIEW_GLOBS).
      - name: ShellCheck the repository
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master as of 2026-09-21, pinned
        with:
          scandir: .
          severity: warning
      # Named explicitly so the hidden `.claude/` directory is scanned whatever the action's discovery does with dot-directories.
      - name: ShellCheck the hooks
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master as of 2026-09-21, pinned
        with:
          scandir: ./.claude/hooks
          severity: warning
